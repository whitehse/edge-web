<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>WiFi audits · edgehost</title>
  <link rel="stylesheet" href="/app.css"/>
</head>
<body class="app-shell" data-nav="wifi-audits" data-title="WiFi audits"
      data-subtitle="Site survey walk paths (review)">

  <section class="card">
    <h2>Audits</h2>
    <div id="list" class="panel-list">Loading…</div>
  </section>
  <section class="card">
    <h2>Upload lab sample audit</h2>
    <button type="button" class="btn primary" id="btnSeed">POST sample walk</button>
    <pre id="out" class="compact"></pre>
  </section>
  <section class="card">
    <h2>GeoJSON</h2>
    <label>Audit id <input id="auditId" type="text"/></label>
    <button type="button" class="btn secondary" id="btnGeo">Load geojson</button>
    <pre id="geo" class="compact" style="max-height:16rem;overflow:auto"></pre>
  </section>

  <script src="/app.js"></script>
  <script src="/shell.js"></script>
  <script src="/wifi-audits/wifi-audits.js"></script>
</body>
</html>
